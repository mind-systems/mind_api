syntax = "proto3";

package mind;

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

// Maps to MeditationNote entity in src/meditation-notes/.
// created_at / updated_at are ISO-8601 strings to match the project convention
// used in SyncEventDto (proto/sync.proto).
// user_id is intentionally absent — identity comes from the JWT/gRPC interceptor,
// matching BciDevice (proto/bci_devices.proto) and NfbCalibrationRecord
// (proto/nfb_calibration.proto).
message MeditationNote {
  string id = 1;
  string session_id = 2;   // empty string if detached (session deleted)
  string pose_id = 3;      // pose UUID (or empty string), no FK, any value accepted
  string note_text = 4;
  string created_at = 5;   // ISO-8601
  string updated_at = 6;   // ISO-8601
}

// ---------------------------------------------------------------------------
// Per-RPC request / response messages
// ---------------------------------------------------------------------------

// Create — auth identity comes from metadata/interceptor, not the message.
message CreateNoteRequest {
  string session_id = 1;
  string pose_id = 2;
  string note_text = 3;
}

// Update — auth identity comes from metadata/interceptor, not the message.
// Only note_text is mutable; pose_id and session binding are immutable after creation.
message UpdateNoteRequest {
  string note_id = 1;
  string note_text = 2;
}

// List — auth identity comes from metadata/interceptor, not the message.
// page_token is an opaque cursor; pass empty string on the first page.
message ListNotesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListNotesResponse {
  repeated MeditationNote notes = 1;
  string next_page_token = 2;  // empty when no more pages
}

// ---------------------------------------------------------------------------
// Service definition
//
// CreateNote — unary RPC that creates a new meditation note for the authenticated
//              user and returns the saved MeditationNote.
// UpdateNote — unary RPC that updates the note_text of an existing note (only
//              note_text is mutable) and returns the updated MeditationNote.
// ListNotes  — unary RPC returning a paginated list of the authenticated user's
//              meditation notes, ordered newest-first.
// ---------------------------------------------------------------------------

service MeditationNotesService {
  rpc CreateNote(CreateNoteRequest) returns (MeditationNote);
  rpc UpdateNote(UpdateNoteRequest) returns (MeditationNote);
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse);
}
