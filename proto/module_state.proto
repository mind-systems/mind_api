syntax = "proto3";

package mind;

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

// Maps to ActivityType enum in src/realtime/enums/activity-type.enum.ts.
// ACTIVITY_TYPE_UNSPECIFIED = 0 is the sentinel to prevent uninitialized fields
// from silently matching a real value.
// ROOT = 3 is the client-addressable root session marker — the client opens it
// via activity:start { activity_type: ROOT } and learns its id from the response.
// Extension point for future activity types.
enum ActivityType {
  ACTIVITY_TYPE_UNSPECIFIED = 0;
  BREATH = 1;
  MEDITATION = 2;
  ROOT = 3;
}

// Maps to SessionStatus enum in src/realtime/enums/session-status.enum.ts.
// ACTIVITY_STATUS_UNSPECIFIED = 0 is the sentinel — a silent default ACTIVE
// could mask bugs where status was never set.
enum ActivityStatus {
  ACTIVITY_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  DISCONNECTED = 2;
  COMPLETED = 3;
  ABANDONED = 4;
  INTERRUPTED = 5;
  RESUMED = 6;
}

// ---------------------------------------------------------------------------
// Client → server commands
// ---------------------------------------------------------------------------

// Maps to ActivityStartDto in src/realtime/dto/activity-start.dto.ts.
// ref_id is the optional breath-session ID (activityRefId in the entity).
message ActivityStartCmd {
  ActivityType activity_type = 1;
  optional string ref_id = 2;
  reserved 3;
  // Client wall-clock instant (Unix millis) that drives startedAt.
  // Optional for backward compatibility — absent means server now().
  optional int64 client_timestamp_ms = 4;
  // Client idempotency token for deduplicating retried activity:start commands
  // (e.g. network retry or double-tap). Server uses this to avoid creating
  // duplicate sessions for the same logical start event.
  optional string client_activity_id = 5;
}

// Maps to ActivityEndDto in src/realtime/dto/activity-end.dto.ts.
message ActivityEndCmd {
  // Client wall-clock instant (Unix millis) that drives endedAt.
  // Optional for backward compatibility — absent means server now().
  optional int64 client_timestamp_ms = 1;
  // Addresses a specific child session among concurrent ones.
  optional string session_id = 2;
}

// Stop is handled inline in the gateway; no existing DTO.
message ActivityStopCmd {
  // Addresses a specific child session among concurrent ones.
  optional string session_id = 1;
}

message ActivityPauseCmd {
  // Addresses a specific child session among concurrent ones.
  optional string session_id = 1;
}

message ActivityResumeCmd {
  // Addresses a specific child session among concurrent ones.
  optional string session_id = 1;
}

// ---------------------------------------------------------------------------
// Server → client events
// ---------------------------------------------------------------------------

// Maps to SessionStateDto in src/realtime/dto/session-state.dto.ts.
// activity_type = 4 is the per-frame discriminator: ROOT ⇒ the frame describes
// the root session; BREATH/MEDITATION ⇒ the frame describes a child session.
message StateEvent {
  string module_session_id = 1;
  ActivityStatus status = 2;
  optional bool is_paused = 3;
  ActivityType activity_type = 4;
}

// Maps to SessionErrorDto in src/realtime/dto/session-error.dto.ts.
// timestamp is int64 Unix millis — not ISO-8601 — because error events are
// high-frequency and don't need human-readable timestamps.
// This message is top-level so module_instruction_stream.proto can import it later.
message StateErrorEvent {
  string code = 1;
  string message = 2;
  int64 timestamp = 3;
}

// ---------------------------------------------------------------------------
// Streaming message wrappers
// ---------------------------------------------------------------------------

// StateRequest is the client-to-server stream envelope.
// Each message carries exactly one command via the oneof.
message StateRequest {
  oneof command {
    ActivityStartCmd activity_start = 1;
    ActivityEndCmd activity_end = 2;
    ActivityStopCmd activity_stop = 3;
    ActivityPauseCmd activity_pause = 4;
    ActivityResumeCmd activity_resume = 5;
  }
}

// StateResponse is the server-to-client stream envelope.
// Each message carries exactly one event via the oneof.
message StateResponse {
  oneof event {
    StateEvent session_state = 1;
    StateErrorEvent session_error = 2;
  }
}

// ---------------------------------------------------------------------------
// Service definition
//
// Bidirectional stream: the client sends commands (StateRequest) and receives
// state/error events (StateResponse). Auth identity comes from metadata/interceptor,
// not the message.
// ---------------------------------------------------------------------------

service ModuleStateService {
  rpc TrackActivity(stream StateRequest) returns (stream StateResponse);
}
