syntax = "proto3";

package mind;

import "google/protobuf/struct.proto";
import "module_state.proto";

// ---------------------------------------------------------------------------
// Client → server samples
// ---------------------------------------------------------------------------

// StreamSample is one instrumentation sample sent by the client.
// session_id ties the sample to an active module session.
// timestamp is int64 Unix millis — same convention as StateErrorEvent.timestamp.
// module_id identifies the producer module (e.g. "breath").
// instruction_type is module-defined and names the specific measurement
// (e.g. "breath_phase").
// data carries the untyped payload so individual modules can evolve their
// schemas independently without a proto change.
message StreamSample {
  string session_id = 1;
  int64 timestamp = 2;
  string module_id = 3;
  string instruction_type = 4;
  google.protobuf.Struct data = 5;
}

// ---------------------------------------------------------------------------
// Server → client acknowledgements
// ---------------------------------------------------------------------------

// StreamAck is the server acknowledgement for a batch of received samples.
// received_count is the cumulative number of samples accepted in this stream.
// dropped_count is the cumulative number of samples discarded (e.g. rate-limited).
// max_samples_per_second is the server-side rate limit hint the client should
// respect to avoid further drops.
// timestamp is int64 Unix millis when the ack was produced.
message StreamAck {
  string session_id = 1;
  int64 received_count = 2;
  int64 dropped_count = 3;
  int32 max_samples_per_second = 4;
  int64 timestamp = 5;
}

// ---------------------------------------------------------------------------
// Streaming message wrappers
// ---------------------------------------------------------------------------

// StreamReady is the server's first outbound frame, emitted the instant the
// controller subscribes — before any client sample is read. It signals the
// client that the server is listening and may start sending.
// max_samples_per_second mirrors StreamAck so the client learns the rate
// limit before its first send.
// timestamp is int64 Unix millis when the ready frame was produced.
message StreamReady {
  int32 max_samples_per_second = 1;
  int64 timestamp = 2;
}

// StreamResponse is the server-to-client stream envelope.
// Each message carries exactly one event via the oneof.
// StateErrorEvent is imported from module_state.proto and reused for error reporting.
message StreamResponse {
  oneof event {
    StreamAck ack = 1;
    StateErrorEvent error = 2;
    StreamReady ready = 3;
  }
}

// ---------------------------------------------------------------------------
// Service definition
//
// Bidirectional stream: the client sends a continuous stream of StreamSample
// samples and the server responds with StreamAck confirmations or
// StateErrorEvent errors. Auth identity comes from metadata/interceptor,
// not the message.
// ---------------------------------------------------------------------------

service ModuleInstructionStreamService {
  rpc StreamData(stream StreamSample) returns (stream StreamResponse);
}
